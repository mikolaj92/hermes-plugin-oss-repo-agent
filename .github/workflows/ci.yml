name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lokay
      - uses: actions/checkout@v4
        with:
          repository: mikolaj92/Fala
          path: Fala
          ref: b5f9a6d500a442a1c79060a862fe4b9da87bc98f
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: bgreni/EmberJson
          path: Fala/vendor/EmberJson
          ref: 882acf141301db4ee797228016982ad6acc71a6f
      - uses: actions/checkout@v4
        with:
          repository: mikolaj92/sqlite.fire
          path: Fala/vendor/sqlite.fire
          ref: 3d482362c863e769d018443045b27ca5db645b3c
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          manifest-path: Fala/pixi.toml
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Fala
        working-directory: lokay
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../Fala
          python -m pip install -e .
          python -m pip install PyYAML
          mkdir -p ../Fala/mojo/fala/native
          cc -std=c11 -Wall -Wextra -dynamiclib \
            -o ../Fala/mojo/fala/native/libfala_process_host.dylib \
            ../Fala/mojo/fala/native_process_host.c
      - name: Run unit suite
        working-directory: lokay
        env:
          FALA_HOME: ${{ github.workspace }}/Fala
          PYTHONPATH: src:.
          CONDA_PREFIX: ${{ github.workspace }}/Fala/.pixi/envs/default
        run: python -m unittest discover -s tests -v
      - name: Hygiene
        working-directory: lokay
        run: python tools/hygiene_check.py .
