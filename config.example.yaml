version: 1
mode: live
clone_root: /absolute/path/to/repos
worktree_root: /absolute/path/to/worktrees
branch_prefix: ai/fix
# Guarded-autonomous production policy: executor and automerge require live mode,
# checks and test evidence remain mandatory, and no separate approval is needed.
automerge: true
require_human_approval: false
require_checks: true
require_test_evidence: true
github:
  cli: gh
  default_limit: 10
  assignee: owner
labels:
  ready: ai:ready
  in_progress: ai:in-progress
  blocked: ai:blocked
  pr_opened: ai:pr-opened
  generated: ai:generated
executor:
  enabled: true
  command: omp
  model: omniroute/omp/default
  thinking: medium
  timeout_seconds: 7200
repos:
  - repo: owner/example-repo
    board: owner-example-repo
    clone_path: /absolute/path/to/repos/example-repo
    trusted_authors: []
    trusted_branch_prefixes: [ai/fix]
    allowed_base_branches: [main]
    external_pr_policy: block
