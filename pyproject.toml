[project]
name = "lokay"
version = "0.2.1"
description = "Lokay — guarded GitHub issue-to-PR automation for Hermes, orchestrated by Fala"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fala==0.7.15",
  "tomli>=2.0.1; python_version < '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
lokay-tick-intake = "lokay.tick_intake:main"
lokay-tick-dispatch = "lokay.tick_dispatch:main"
lokay-tick-triage = "lokay.tick_triage:main"
lokay-tick-cleanup = "lokay.tick_cleanup:main"
lokay-tick-all = "lokay.tick_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokay"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
fala = { git = "https://github.com/mikolaj92/Fala.git", tag = "v0.7.15" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
